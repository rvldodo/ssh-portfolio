# Production stack: the portfolio TUI over SSH on port 22.
#
#   ssh <domain>  ->  :22  ->  portfolio
#
# Usage on the VPS:  docker compose up -d --build

services:
  portfolio:
    build: .
    restart: unless-stopped
    ports:
      - "22:22"                  # public SSH goes straight to the app
    volumes:
      - portfolio-data:/data     # host key: keep it stable forever

volumes:
  portfolio-data:
